name: Keşif (tek seferlik veri toplama)
on:
  push:
    branches: [kesif]
permissions:
  contents: read
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python kesif/topla.py
