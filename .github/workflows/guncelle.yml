name: Verileri güncelle ve yayınla

on:
  schedule:
    - cron: '7,27,47 * * * *'      # her 20 dakikada bir (GitHub yoğunlukta birkaç dakika geciktirebilir)
  workflow_dispatch:
    inputs:
      tam:
        description: 'Önbelleği yok say, bütün kaynakları yeniden indir'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['tahmin/**', 'site/**', 'data/history.csv', 'data/frozen/**', 'model.lock', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.calis.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Önbelleği geri yükle
        uses: actions/cache@v4
        with:
          path: .cache
          key: veri-${{ github.run_id }}
          restore-keys: veri-
      - name: Formül kilidi
        run: python tahmin/lock.py check
      - name: Verileri çek, tahmin et, siteyi üret
        id: calis
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: python tahmin/pipeline.py ${{ (github.event_name == 'workflow_dispatch' && inputs.tam) && '--force' || '' }}
      - name: Tarayıcı motoru ile Python aynı sonucu veriyor mu
        run: node site/parity_test.js .cache/parity.json
      - name: Kalıcı kayıtları depoya yaz (yalnızca ekleme)
        run: |
          git config user.name "tahmin-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data/seasons
          if ! git diff --cached --quiet; then
            git commit -m "Veri: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.calis.outputs.deploy == 'true'
        with:
          path: _site

  yayinla:
    needs: guncelle
    if: needs.guncelle.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
